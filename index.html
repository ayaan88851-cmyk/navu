<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Please Say Yes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
:root{--bg:#ffd9e6;--bg2:#ffb8d0;--ink:#47183a;--pink:#ff5c8a;--cream:#fff8f2;--gold:#ffd36b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2));overflow:hidden;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.bgdots{position:fixed;inset:0;background-image:radial-gradient(#fff6 2px,transparent 2.5px);background-size:26px 26px;pointer-events:none}
main{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.bubble{background:var(--cream);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:14px 20px;font-size:22px;line-height:1.25;min-height:4.4em;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
.bubble::after{content:"";position:absolute;left:50%;bottom:-14px;width:22px;height:22px;background:var(--cream);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.pet{width:min(52vw,210px);margin-top:10px;transition:transform .25s}
.pet svg{width:100%;display:block;overflow:visible;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pet.wobble{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.btns{display:flex;align-items:center;justify-content:center;gap:16px;min-height:120px;width:100%}
.btn{font:inherit;font-weight:600;color:var(--ink);border:3px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#yes{background:var(--pink);font-size:22px;padding:12px 30px}
#no{background:var(--cream);font-size:18px;padding:9px 20px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.win{position:fixed;inset:0;background:linear-gradient(180deg,#ffe9f1,#ff9fbe);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;z-index:20}
.win[hidden]{display:none}
.win h2{font-size:40px;margin:0;line-height:1.1}
.win p{font-size:20px;margin:0;max-width:20em}
.win .btn{background:var(--gold);padding:10px 26px;font-size:18px}
.conf{position:fixed;top:-30px;font-size:26px;animation:fall linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.photo{position:fixed;left:50%;bottom:0;transform:translateX(-50%);height:46vh;max-width:90vw;object-fit:contain;opacity:.32;pointer-events:none;z-index:0;filter:drop-shadow(0 0 14px #fff8)}
main{z-index:1}
.win .photo2{height:46vh;max-width:88vw;object-fit:contain;filter:drop-shadow(0 6px 0 #47183a33)}
</style>
</head>

  <button class="btn" id="again" type="button">Do it again</button>
</div>

<script>
/* EDIT THESE: the question and the pleading lines */
var QUESTION = "Do you love me?";
var YES_TEXT = "Yes";
var WIN_TITLE = "Yaaay! I love you too!";
var STEPS = [
  "Are you sure?",
  "Really really sure?",
  "Think about it again...",
  "Please? Pretty please?",
  "I'll share my fries with you",
  "You're breaking my little heart",
  "I'm going to cry now",
  "Okay this is getting silly",
  "Just press the big pink button"
];

var msg=document.getElementById('msg'),yes=document.getElementById('yes'),no=document.getElementById('no'),
    pet=document.getElementById('pet'),eyes=document.getElementById('eyes'),mouth=document.getElementById('mouth'),
    tear=document.getElementById('tear'),dots=document.getElementById('dots'),win=document.getElementById('win'),
    n=0;

function setFace(mood){
  var open='<circle cx="58" cy="70" r="7" fill="#47183a"/><circle cx="102" cy="70" r="7" fill="#47183a"/><circle cx="55.5" cy="67" r="2.3" fill="#fff"/><circle cx="99.5" cy="67" r="2.3" fill="#fff"/>';
  var happy='<path d="M50 74 Q58 62 66 74" fill="none" stroke="#47183a" stroke-width="5" stroke-linecap="round"/><path d="M94 74 Q102 62 110 74" fill="none" stroke="#47183a" stroke-width="5" stroke-linecap="round"/>';
  var sad='<circle cx="58" cy="72" r="7" fill="#47183a"/><circle cx="102" cy="72" r="7" fill="#47183a"/><circle cx="55.5" cy="69" r="3" fill="#fff"/><circle cx="99.5" cy="69" r="3" fill="#fff"/><path d="M46 58 L68 64" stroke="#47183a" stroke-width="4" stroke-linecap="round"/><path d="M114 58 L92 64" stroke="#47183a" stroke-width="4" stroke-linecap="round"/>';
  eyes.innerHTML = mood==='happy'?happy : mood==='sad'?sad : open;
  mouth.setAttribute('d', mood==='happy'?'M62 100 Q80 124 98 100 Z' : mood==='sad'?'M66 110 Q80 98 94 110' : 'M66 102 Q80 114 94 102');
  mouth.setAttribute('fill', mood==='happy'?'#ff8fb1':'none');
  tear.setAttribute('opacity', mood==='sad'&&n>=6?1:0);
}

function drawDots(){
  dots.innerHTML='';
  for(var i=0;i<STEPS.length;i++){var d=document.createElement('i');if(i<n)d.className='on';dots.appendChild(d)}
}

function reset(){
  n=0;msg.textContent=QUESTION;no.textContent='No';
  yes.style.fontSize='';yes.style.padding='';no.style.fontSize='';no.style.padding='';no.style.opacity='';no.style.transform='';
  no.hidden=false;win.hidden=true;setFace('open');drawDots();
}

no.addEventListener('click',function(){
  n=Math.min(n+1,STEPS.length);
  msg.textContent=STEPS[n-1];
  yes.style.fontSize=(22+n*5)+'px';
  yes.style.padding=(12+n*4)+'px '+(30+n*10)+'px';
  var s=Math.max(.35,1-n*.09);
  no.style.transform='scale('+s+')';
  no.style.opacity=Math.max(.35,1-n*.07);
  if(n>=STEPS.length){no.hidden=true}
  setFace('sad');drawDots();
  pet.classList.remove('wobble');void pet.offsetWidth;pet.classList.add('wobble');
});

function confetti(){
  var E=['💗','💖','💕','🩷','✨','🌸'];
  for(var i=0;i<46;i++){
    var c=document.createElement('div');c.className='conf';c.textContent=E[i%E.length];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(2+Math.random()*2.2)+'s';
    c.style.animationDelay=(Math.random()*.8)+'s';
    c.addEventListener('animationend',function(e){e.target.remove()});
    document.body.appendChild(c);
  }
}
yes.addEventListener('click',function(){
  document.getElementById('winTitle').textContent=WIN_TITLE;
  win.hidden=false;setFace('happy');confetti();
});
document.getElementById('again').addEventListener('click',reset);

yes.textContent=YES_TEXT;
reset();
</script>
</body>
</html>
